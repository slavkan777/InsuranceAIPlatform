# =====================================================================
# GHCR image build — MANUAL ONLY (workflow_dispatch). Never runs on push.
# The build+push job is GUARDED behind an explicit 'confirm: BUILD_IMAGE' input.
# A manual run with the default input only validates (bicep + backend + frontend build).
# Authentication uses the built-in secrets.GITHUB_TOKEN via docker/login-action
# (never printed). No Azure login, no deploy, no stored cloud secrets.
# =====================================================================
name: ghcr-image-build (manual, confirm=BUILD_IMAGE)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD_IMAGE to build server/Dockerfile and push to GHCR (otherwise validate-only)."
        required: false
        default: "validate-only"

permissions:
  contents: read
  packages: write   # GHCR image push (only used by the guarded build job)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: insuranceai-api

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bicep build (offline, no login)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep
      - name: Backend build (Release)
        run: dotnet build server/InsuranceAIPlatform.sln -c Release
      - name: Frontend build
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------
  # Build the API image from server/Dockerfile and push to GHCR.
  # GUARDED: only runs on a manual dispatch with confirm=BUILD_IMAGE.
  # Uses the built-in GITHUB_TOKEN (packages: write) — no stored secrets.
  # ---------------------------------------------------------------
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'BUILD_IMAGE' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image (context = server/)
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
